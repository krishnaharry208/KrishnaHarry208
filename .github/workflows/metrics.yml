name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: krishnaharry208
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          
          template: classic
          base: header, activity, community, repositories
          base_indepth: false
          base_hireable: false
          config_timezone: Asia/Tokyo
          config_padding: 0, 8
          config_order: base.header, base.activity+community, base.repositories, gists, isocalendar

          plugin_gists: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: krishnaharry208
          filename: github-metrics-calendar.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update calendar-last metrics [skip ci]"

          template: classic
          base: header, activity, community, repositories
          base_indepth: false
          base_hireable: false
          config_timezone: Asia/Tokyo
          config_padding: 0, 8
          config_order: base.header, base.activity+community, base.repositories, gists, isocalendar

          plugin_gists: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Refresh README metrics image URL
        run: |
          git pull --ff-only origin main
          bash scripts/update_readme_image.sh
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh metrics image cache key [skip ci]"
          git push origin main
