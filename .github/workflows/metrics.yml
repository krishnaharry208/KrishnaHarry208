name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: krishnaharry208
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          
          template: classic
          base: header, activity, community, repositories
          base_indepth: false
          base_hireable: false
          config_timezone: Asia/Tokyo
          config_padding: 0, 8
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata, isocalendar

          plugin_gists: yes
          plugin_sponsors: yes
          plugin_sponsors_sections: goal, list

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: krishnaharry208
          filename: github-metrics-calendar.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update calendar-last metrics [skip ci]"

          template: classic
          base: header, activity, community, repositories
          base_indepth: false
          base_hireable: false
          config_timezone: Asia/Tokyo
          config_padding: 0, 8
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata, gists, sponsors, isocalendar

          plugin_gists: yes
          plugin_sponsors: yes
          plugin_sponsors_sections: goal, list
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
